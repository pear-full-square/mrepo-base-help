<title>haicc info view</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a terminal line on top (the command this page answers), then the page and its keywords side by side; one column on a phone. */
:root {
  --bg: #f6f7f5; --panel: #ffffff; --fg: #1d2420; --muted: #5d6b63; --line: #dfe4e0;
  --accent: #1f7a5a; --accent-soft: #e3f1ea; --code-bg: #eef1ee; --term-bg: #18201c; --term-fg: #d9efe3; --term-dim: #8fb3a1;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121815; --panel: #18201c; --fg: #e3ece7; --muted: #94a69c; --line: #2a352f;
  --accent: #5cc79c; --accent-soft: #1f3329; --code-bg: #1f2924; --term-bg: #0b100d; --term-fg: #d9efe3; --term-dim: #7f9e8f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121815; --panel: #18201c; --fg: #e3ece7; --muted: #94a69c; --line: #2a352f;
  --accent: #5cc79c; --accent-soft: #1f3329; --code-bg: #1f2924; --term-bg: #0b100d; --term-fg: #d9efe3; --term-dim: #7f9e8f; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
header h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: .01em; }
header h1 span { color: var(--muted); font-weight: 400; }
.note { color: var(--muted); font-size: 13px; }
.term { background: var(--term-bg); color: var(--term-fg); font-family: var(--mono); font-size: 14px; border-radius: 8px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; min-width: 0; }
.term .prompt { color: var(--term-dim); user-select: none; }
.term code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; }
.term button { font: inherit; font-size: 12px; background: transparent; color: var(--term-dim); border: 1px solid #3a4a42; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
.term button:hover, .term button:focus-visible { color: var(--term-fg); border-color: var(--term-dim); outline: none; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-family: var(--mono); font-size: 13px; }
.crumbs a { color: var(--accent); text-decoration: none; padding: 2px 6px; border-radius: 4px; }
.crumbs a:hover, .crumbs a:focus-visible { background: var(--accent-soft); outline: none; }
.crumbs .sep { color: var(--muted); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: minmax(0, 1fr); } }
.choice { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px 24px; min-width: 0; display: grid; gap: 4px; }
.choices { display: grid; gap: 16px; min-width: 0; }
.tag { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.tag b { color: var(--accent); font-weight: 500; }
.doc h1, .doc h2, .doc h3 { line-height: 1.3; text-wrap: balance; }
.doc h1 { font-size: 24px; margin: 4px 0 8px; font-family: var(--mono); font-weight: 500; }
.doc h2 { font-size: 17px; margin: 22px 0 6px; padding-top: 14px; border-top: 1px solid var(--line); }
.doc h3 { font-size: 15px; margin: 16px 0 4px; color: var(--muted); }
.doc p, .doc li { max-width: 70ch; }
.doc code { font-family: var(--mono); font-size: .9em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.doc pre { background: var(--code-bg); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font-size: 13px; line-height: 1.5; }
.doc pre code { background: none; padding: 0; }
.doc .tbl { overflow-x: auto; }
.doc table { border-collapse: collapse; font-size: 14px; }
.doc th, .doc td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.doc th { color: var(--muted); font-weight: 500; }
.doc a { color: var(--accent); }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; min-width: 0; }
aside h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
.kw { display: grid; gap: 2px; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: var(--fg); border: 1px solid transparent; }
.kw:hover, .kw:focus-visible { background: var(--accent-soft); border-color: var(--line); outline: none; }
.kw .k { font-family: var(--mono); font-size: 13px; color: var(--accent); }
.kw .k small { color: var(--muted); margin-left: 6px; }
.kw .o { font-size: 13px; color: var(--muted); line-height: 1.45; }
.empty { color: var(--muted); font-size: 14px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.bar label { font-size: 13px; color: var(--muted); }
.bar select { font: inherit; font-size: 14px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
.pill { font-family: var(--mono); font-size: 12px; border-radius: 999px; padding: 2px 10px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
.pill.bad { color: #b4471d; border-color: #e6b8a2; background: #fbeee7; }
.pill.ok { color: var(--accent); border-color: var(--line); background: var(--accent-soft); cursor: default; }
:root[data-theme="dark"] .pill.bad { color: #f0a17c; border-color: #6b3a25; background: #2b1a12; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.bad { color: #f0a17c; border-color: #6b3a25; background: #2b1a12; } }
.problems { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; font-family: var(--mono); font-size: 13px; overflow-x: auto; }
.problems div { padding: 3px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.problems div:last-child { border-bottom: 0; }
.problems b { color: #b4471d; font-weight: 500; }
.miss { background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; padding: 20px 24px; font-family: var(--mono); font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .choices { animation: in .18s ease-out; } @keyframes in { from { opacity: .4 } to { opacity: 1 } } }
</style>

<div class="wrap">
  <header>
    <h1>haicc info <span>· by keywords, as info/get answers</span></h1>
    <div class="note" id="made"></div>
  </header>
  <div class="bar">
    <label for="target">Show</label>
    <select id="target"></select>
    <button class="pill" id="pb" type="button"></button>
  </div>
  <div class="problems" id="problems" hidden></div>
  <div class="term" aria-label="The command this page answers">
    <span class="prompt">$</span><code id="cmd">haicc docs info/get</code><button id="copy" type="button">Copy</button>
  </div>
  <nav class="crumbs" id="crumbs" aria-label="Keyword path"></nav>
  <div class="main">
    <div class="choices" id="choices"></div>
    <aside>
      <h2>Keywords below</h2>
      <div id="below"></div>
    </aside>
  </div>
</div>

<script>
const DATA = /*DATA*/null;
const { targets, pages } = DATA;
let T = 0;
let index = targets[0].index;
const TOP = '.';
const MENUS = ['Links', 'Included packages'];
const kwOf = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const norm = p => p.split('/').map(kwOf).filter(Boolean).join('/') || TOP;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// A page's text: its sections, the menus left out (they are its keywords).
function sections (text) {
  const lines = text.replace(/\r/g, '').split('\n'); const out = []; let cur = { title: null, lines: [] }; let code = false
  for (const l of lines) {
    if (l.startsWith('```')) code = !code
    if (!code && l.startsWith('## ')) { out.push(cur); cur = { title: l.slice(3).trim(), lines: [] } } else cur.lines.push(l)
  }
  out.push(cur); return out
}
function said (text, section) {
  const parts = sections(text)
  if (section) { const s = parts.find(p => p.title === section); return s ? s.lines.join('\n').trim() : '' }
  return parts.filter(p => !MENUS.includes(p.title)).map(p => (p.title ? `## ${p.title}\n` : '') + p.lines.join('\n')).join('\n').trim()
}

// Markdown, as far as the pages use it: headings, paragraphs, lists, code, tables.
function inline (s) {
  return esc(s)
    .replace(/`([^`]+)`/g, (m, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, h) => /^https?:/.test(h) ? `<a href="${h}" target="_blank" rel="noopener">${t}</a>` : `<span title="${h}">${t}</span>`)
}
function md (text) {
  const L = text.split('\n'); const out = []; let i = 0
  while (i < L.length) {
    const l = L[i]
    if (l.startsWith('```')) { const b = []; i++; while (i < L.length && !L[i].startsWith('```')) b.push(L[i++]); i++; out.push(`<pre><code>${esc(b.join('\n'))}</code></pre>`); continue }
    if (/^#{1,3} /.test(l)) { const n = l.match(/^#+/)[0].length; out.push(`<h${n}>${inline(l.slice(n + 1))}</h${n}>`); i++; continue }
    if (l.startsWith('|')) { const rows = []; while (i < L.length && L[i].startsWith('|')) rows.push(L[i++]); const cells = r => r.replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map(c => c.trim()); const body = rows.filter(r => !/^\|\s*-/.test(r)); out.push(`<div class="tbl"><table>${body.map((r, n) => `<tr>${cells(r).map(c => n === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</table></div>`); continue }
    if (/^\s*([-*]|\d+\.)\s/.test(l)) {
      const ordered = /^\s*\d+\./.test(l); const items = []
      while (i < L.length && (/^\s*([-*]|\d+\.)\s/.test(L[i]) || (/^\s{2,}\S/.test(L[i]) && items.length))) { if (/^\s*([-*]|\d+\.)\s/.test(L[i])) items.push(L[i].replace(/^\s*([-*]|\d+\.)\s/, '')); else items[items.length - 1] += ' ' + L[i].trim(); i++ }
      out.push(`<${ordered ? 'ol' : 'ul'}>${items.map(x => `<li>${inline(x)}</li>`).join('')}</${ordered ? 'ol' : 'ul'}>`); continue
    }
    if (!l.trim()) { i++; continue }
    const p = []; while (i < L.length && L[i].trim() && !/^(#{1,3} |```|\||\s*([-*]|\d+\.)\s)/.test(L[i])) p.push(L[i++])
    out.push(`<p>${inline(p.join(' '))}</p>`)
  }
  return out.join('\n')
}

// info/get, as the docs mrepo answers it.
function get (k) {
  const choices = index[k]
  if (!choices) {
    const parts = k.split('/'); let near = TOP
    for (let i = parts.length - 1; i > 0; i--) if (index[parts.slice(0, i).join('/')]) { near = parts.slice(0, i).join('/'); break }
    return { miss: true, keyword: k, near }
  }
  return { keyword: k, choices: choices.map(c => {
    const text = pages[c.page] ?? ''
    const title = c.section ?? ((text.match(/^# (.*)$/m) ?? [])[1] ?? c.page)
    return { title, oneliner: c.oneliner, page: c.section ? said(text, c.section) : said(text).replace(/^# .*\n?/, ''), section: c.section, source: c.page, see: c.see, generated: c.generated, below: c.below.map(b => ({ keyword: b, oneliner: index[b]?.[0]?.oneliner ?? '', choices: index[b]?.length ?? 0 })) }
  }) }
}

const slug = t => t.name.split('/').pop()
const hashOf = k => '#' + slug(targets[T]) + (k === TOP ? '' : '---' + k.split('/').join('--'))
function parse (h) {
  const s = h.replace(/^#/, ''); const [name, rest] = s.split('---')
  const t = targets.findIndex(x => slug(x) === name)
  return { t: t === -1 ? 0 : t, k: rest ? rest.split('--').join('/') : TOP }
}
function go (k) { const h = hashOf(k); if (location.hash !== h) location.hash = h; else show(k) }
function setTarget (t) {
  T = t; index = targets[T].index
  document.getElementById('target').value = String(T)
  const n = targets[T].problems.length; const pb = document.getElementById('pb'); const P = document.getElementById('problems')
  pb.textContent = n ? `${n} problem${n > 1 ? 's' : ''}` : 'no problems'
  pb.className = 'pill ' + (n ? 'bad' : 'ok'); pb.disabled = !n
  P.innerHTML = targets[T].problems.map(p => `<div><b>${esc(p.check)}</b> ${esc(p.page ?? p.keyword ?? '')}: ${esc(p.detail)}</div>`).join(''); P.hidden = true
}
function link (k, inner, cls) { return `<a class="${cls}" href="${hashOf(k) || '#'}" data-k="${esc(k)}">${inner}</a>` }

function show (k) {
  const r = get(k)
  const tg = targets[T]
  document.getElementById('cmd').textContent = tg.kind === 'mrepo' ? `haicc ${tg.at} info/get${k === TOP ? '' : ' ' + k}` : `# ${tg.name} on its own, as its generic info test reads it${k === TOP ? '' : ': ' + k}`
  const parts = k === TOP ? [] : k.split('/')
  document.getElementById('crumbs').innerHTML = link(TOP, tg.kind === 'mrepo' ? tg.at === '.' ? 'boot' : tg.at : slug(tg), '') + parts.map((p, i) => `<span class="sep">/</span>${link(parts.slice(0, i + 1).join('/'), esc(p), '')}`).join('')
  const C = document.getElementById('choices'); const B = document.getElementById('below')
  if (r.miss) {
    C.innerHTML = `<div class="miss">haicc: no ${esc(k)} here: nearest ${esc(r.near)}<br><br>${link(r.near, 'Go to ' + esc(r.near), '')}</div>`
    B.innerHTML = ''; return
  }
  C.innerHTML = r.choices.map((c, n) => `<article class="choice">
    <div class="tag">${r.choices.length > 1 ? `<b>choice ${n + 1} of ${r.choices.length}</b> · ` : ''}${esc(c.source)}${c.section ? ' · section' : ''}${c.generated ? ' · made at extraction' : ''}</div>
    <div class="doc"><h1>${esc(c.title)}</h1>${c.see ? `<p>The module's own page: ${link(c.see, esc(c.see), '')}</p>` : ''}${md(c.page)}</div>
  </article>`).join('')
  const below = r.choices.flatMap(c => c.below)
  B.innerHTML = below.length ? below.map(b => link(b.keyword, `<span class="k">${esc(b.keyword.split('/').pop())}${b.choices > 1 ? `<small>${b.choices} choices</small>` : ''}</span><span class="o">${esc(b.oneliner)}</span>`, 'kw')).join('') : '<div class="empty">Nothing below this one.</div>'
  window.scrollTo({ top: 0 })
}

document.addEventListener('click', e => { const a = e.target.closest('a[data-k]'); if (!a) return; e.preventDefault(); go(a.dataset.k) })
function route () { const r = parse(location.hash); if (r.t !== T || index !== targets[r.t].index) setTarget(r.t); show(r.k) }
window.addEventListener('hashchange', route)
const sel = document.getElementById('target')
sel.innerHTML = `<optgroup label="An mrepo, its packages together">${targets.map((t, i) => t.kind === 'mrepo' ? `<option value="${i}">${t.at === '.' ? 'boot mrepo' : t.at + ' mrepo'}: ${esc(slug(t))}</option>` : '').join('')}</optgroup><optgroup label="A package on its own">${targets.map((t, i) => t.kind === 'package' ? `<option value="${i}">${esc(slug(t))}${t.problems.length ? ' (' + t.problems.length + ')' : ''}</option>` : '').join('')}</optgroup>`
sel.addEventListener('change', () => { T = Number(sel.value); index = targets[T].index; location.hash = hashOf(TOP) })
document.getElementById('pb').addEventListener('click', () => { const P = document.getElementById('problems'); P.hidden = !P.hidden })
document.getElementById('made').textContent = 'Extracted ' + DATA.made.slice(0, 16).replace('T', ' ') + ' UTC, from the sources'
document.getElementById('copy').addEventListener('click', e => {
  const t = document.getElementById('cmd').textContent
  try { navigator.clipboard.writeText(t).then(() => { e.target.textContent = 'Copied'; setTimeout(() => e.target.textContent = 'Copy', 1200) }, () => {}) } catch (err) { /* select instead */ }
})
setTarget(parse(location.hash).t); route()
</script>
